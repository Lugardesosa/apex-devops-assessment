version: '3.9'

services:
  db:
    image: postgres:15-alpine
    container_name: apex_db
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: apex_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d apex_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: apex_api
    environment:
      DATABASE_URL: postgresql://user:password@db:5432/apex_db
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  postgres_data:
